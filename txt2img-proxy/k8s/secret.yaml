# ============================================================
#  txt2img-proxy — 凭证
#  ark 使用 AK/SK（SigV4 签名），通过 Vault + ExternalSecret 同步
#  手动写入（仅测试用）:
#    kubectl create secret generic txt2img-api-keys -n txt2img \
#      --from-literal=ARK_ACCESS_KEY="<你的AccessKey>" \
#      --from-literal=ARK_SECRET_KEY="<你的SecretKey>"
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: txt2img-api-keys
  namespace: txt2img
type: Opaque
stringData:
  ARK_ACCESS_KEY: ""
  ARK_SECRET_KEY: ""
  # ── 其他平台（按需启用） ──
  REPLICATE_API_KEY: ""
  TOGETHER_API_KEY: ""
  STABILITY_API_KEY: ""
  OPENAI_API_KEY: ""
