# ============================================================
#  txt2img-proxy — API 密钥
#  通过 Vault + ExternalSecret 自动同步，见 vault/inventory/txt2img-externalsecret.yaml
#  手动写入（仅测试用）:
#    kubectl apply -f k8s/secret.yaml
#    kubectl create secret generic txt2img-api-keys -n txt2img \
#      --from-literal=ARK_API_KEY="<key>" \
#      --from-literal=OPENAI_API_KEY="<key>"
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: txt2img-api-keys
  namespace: txt2img
type: Opaque
stringData:
  ARK_API_KEY: ""
  REPLICATE_API_KEY: ""
  TOGETHER_API_KEY: ""
  STABILITY_API_KEY: ""
  OPENAI_API_KEY: ""
