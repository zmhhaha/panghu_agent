# ============================================================
#  txt2img-proxy — Deployment + Service
#  配置来源: ConfigMap txt2img-config（PROVIDER, MODEL）
#  密钥来源: Secret  txt2img-api-keys（各平台凭证）
#
#  ark 使用 AK/SK 签名（ARK_ACCESS_KEY / ARK_SECRET_KEY）
#  其他平台使用 API Key
#
#  部署:
#    kubectl apply -f k8s/namespace.yaml
#    kubectl apply -f k8s/secret.yaml       # 通过 Vault + ESO 同步
#    kubectl apply -f k8s/configmap.yaml
#    kubectl apply -f k8s/deployment.yaml
#
#  更新:
#    修改 configmap.yaml 或 secret.yaml → kubectl apply → rollout restart
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: txt2img-proxy
  namespace: txt2img
spec:
  replicas: 1
  selector:
    matchLabels:
      app: txt2img-proxy
  template:
    metadata:
      labels:
        app: txt2img-proxy
    spec:
      containers:
      - name: proxy
        image: arm-cluster-master:5000/txt2img-proxy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        # ── 通用配置（ConfigMap） ──
        envFrom:
        - configMapRef:
            name: txt2img-config
        # ── 凭证（Secret） ──
        env:
        # ark — AK/SK（SigV4 签名）
        - name: ARK_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: ARK_ACCESS_KEY
              optional: true
        - name: ARK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: ARK_SECRET_KEY
              optional: true
        # 其他平台（兼容保留）
        - name: REPLICATE_API_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: REPLICATE_API_KEY
              optional: true
        - name: TOGETHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: TOGETHER_API_KEY
              optional: true
        - name: STABILITY_API_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: STABILITY_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: txt2img-api-keys
              key: OPENAI_API_KEY
              optional: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: txt2img-proxy
  namespace: txt2img
spec:
  selector:
    app: txt2img-proxy
  ports:
  - port: 8000
    targetPort: 8000
    name: http
