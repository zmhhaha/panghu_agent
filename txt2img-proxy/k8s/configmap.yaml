# ============================================================
#  txt2img-proxy — 通用配置
#  PROVIDER=ark 时使用 SigV4 签名的火山引擎视觉 CV API
#  切换 PROVIDER 来更换图片生成平台
#  修改后: kubectl apply -f k8s/configmap.yaml && kubectl rollout restart deploy txt2img-proxy -n txt2img
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: txt2img-config
  namespace: txt2img
data:
  PROVIDER: "ark"
  MODEL: ""
