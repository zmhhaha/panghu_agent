apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-llm-service
  namespace: content-agents
spec:
  replicas: 1
  selector:
    matchLabels: {app: content-llm-service}
  template:
    metadata:
      labels:
        app: content-llm-service
        # llm-service 的 NetworkPolicy 只放行带此标签的 Pod
        llm-client: "true"
    spec:
      containers:
        - name: api
          image: arm-cluster-master:5000/panghu-content-llm:latest
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: content-llm-config}
            - secretRef: {name: content-llm-secret, optional: true}
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: content-llm-service
  namespace: content-agents
spec:
  selector: {app: content-llm-service}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-llm-config
  namespace: content-agents
data:
  # 统一走集群内 llm-service：这里只配入口与能力档位，
  # provider 凭据由 llm-service 持有（本服务不再保存任何 provider API Key）。
  # 用 deepseek-trusted：本服务的 CrewAI 需要函数调用（网页工具），
  # 而 deepseek-guarded 在 llm-service 侧禁止 tools，会直接 400。
  LLM_BASE_URL: http://llm-service.llm.svc.cluster.local/v1
  LLM_MODEL: deepseek-trusted
