# The CNI must enforce NetworkPolicy; applying YAML is not an isolation test.
# A dedicated task model proxy runs outside the Agent Pod. No supplier key or
# upstream Internet permission belongs to this Worker network boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-capsules
  namespace: agent-workers
spec:
  podSelector:
    matchLabels:
      app: agent-capsule
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-service
          podSelector:
            matchLabels:
              app: agent-service
              component: dispatcher
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-service
          podSelector:
            matchLabels:
              app: agent-model-proxy
      ports:
        - protocol: TCP
          port: 8080
