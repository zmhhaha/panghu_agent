# Source counterpart for the canonical platform inventory:
# armbianbegin/vault/inventory/agent-service-externalsecret.yaml.
# No credential values belong in this file. The upstream model caller token is
# referenced from llm-service's authoritative record, never copied to runtime.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-service-runtime
  namespace: agent-service
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: agent-service-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.json: |
          {
            "database_url": {{ .database_url | toJson }},
            "tokens": {
              "ppt-service": {{ .ppt_token | toJson }},
              "scientific-service": {{ .scientific_token | toJson }},
              "pi-worker-pool": {{ .pi_worker_token | toJson }},
              "hermes-worker-pool": {{ .hermes_worker_token | toJson }},
              "model-upstream": {{ .model_upstream | toJson }}
            },
            "receipt_keys": {
              "pi-worker-pool": {{ .pi_receipt | toJson }},
              "hermes-worker-pool": {{ .hermes_receipt | toJson }},
              "model-signing": {{ .model_signing | toJson }}
            }
          }
  data:
    - secretKey: database_url
      remoteRef: {key: secret/data/agent-service/runtime, property: DATABASE_URL}
    - secretKey: ppt_token
      remoteRef: {key: secret/data/agent-service/runtime, property: PPT_SERVICE_TOKEN}
    - secretKey: scientific_token
      remoteRef: {key: secret/data/agent-service/runtime, property: SCIENTIFIC_SERVICE_TOKEN}
    - secretKey: pi_worker_token
      remoteRef: {key: secret/data/agent-service/runtime, property: PI_WORKER_TOKEN}
    - secretKey: hermes_worker_token
      remoteRef: {key: secret/data/agent-service/runtime, property: HERMES_WORKER_TOKEN}
    - secretKey: pi_receipt
      remoteRef: {key: secret/data/agent-service/runtime, property: PI_RECEIPT_KEY_BASE64}
    - secretKey: hermes_receipt
      remoteRef: {key: secret/data/agent-service/runtime, property: HERMES_RECEIPT_KEY_BASE64}
    - secretKey: model_signing
      remoteRef: {key: secret/data/agent-service/runtime, property: MODEL_SIGNING_KEY_BASE64}
    - secretKey: model_upstream
      remoteRef: {key: secret/data/llm-service/callers, property: LLM_TOKEN_AGENT_EXECUTION}
---
# Business-side credential projections use the same authoritative record.
# Their namespaces remain owned/created by the existing business deployments.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppt-agent-service
  namespace: ppt-service
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: ppt-agent-service
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: secret/data/agent-service/runtime, property: PPT_SERVICE_TOKEN}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scientific-agent-service
  namespace: scientific-agent
spec:
  refreshInterval: 5m
  secretStoreRef: {name: vault-backend, kind: ClusterSecretStore}
  target:
    name: scientific-agent-service
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: secret/data/agent-service/runtime, property: SCIENTIFIC_SERVICE_TOKEN}
