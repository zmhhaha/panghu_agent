# Deployment: apply with content_agents/deploy.sh. Keep secrets out of this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: content-agents-config
  namespace: content-agents
data:
  CONTENT_DATA_DIR: /data/content-agents
  AGENT_CHANNELS: json,rss,hublog
  BOT_DRAFT_ONLY: "false"
  BOT_MAX_ITEMS: "5"
  BOT_LOOKBACK_HOURS: "24"
  CONTENT_AUTO_APPROVE: "true"
  HUBLOG_BASE_URL: http://hublog-api.hublog.svc.cluster.local
  LLM_BASE_URL: ""
  LLM_MODEL: gpt-4o-mini
  LLM_REQUIRED: "false"
  MEME_AGENT_ENABLED: "true"
  MEME_AGENT_SERVICE_URL: http://content-llm-service.content-agents.svc.cluster.local
  NEWS_FEEDS: "China News International|https://www.chinanews.com.cn/rss/world.xml"
  MEME_FEEDS: "Bilibili Hot Ranking|https://api.bilibili.com/x/web-interface/ranking/v2?rid=0&type=all"
  MEME_MIN_SCORE: "6"
  MEME_MAX_TITLE_LENGTH: "12"
