# Deployment: deploy.sh renders image registry and tag before applying this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-trending-agent
  namespace: content-agents
spec:
  timeZone: Asia/Shanghai
  schedule: "0 0 * * *" # 08:00 Asia/Shanghai when the cluster clock is UTC.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Completed or failed Jobs are retained for one hour, then cleaned by
      # the Kubernetes TTL controller.
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: agent
              image: arm-cluster-master:5000/panghu-content-github-trending:latest
              imagePullPolicy: Always
              command: [python, -m, content_agents.github_trending_agent.main]
              envFrom:
                - configMapRef:
                    name: content-agents-config
                - secretRef:
                    name: content-agent-hublog
                    optional: true
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                # Short-lived batch worker: reserve only startup capacity; limits remain the runtime ceiling.
                requests: {cpu: 10m, memory: 32Mi}
                limits: {cpu: 500m, memory: 512Mi}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: content-agents-data
