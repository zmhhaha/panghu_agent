# ============================================================
#  content-agents -> llm-service 调用令牌（日报 bot 用）
#
#  只有 llm-guard-report-agent 需要它：那个 CronJob 要读 llm-service 的
#  /v1/guard/report 全量汇总，身份是 llm-report。
#
#  与 RAG 的 rag-token、其它 Agent 的 llm-token 同一套约定：从
#  secret/llm-service/callers 里**只取本调用方那一个键**，拿不到别人的令牌。
#  llm-service 由变量名反推身份（LLM_TOKEN_LLM_REPORT -> llm-report）。
#
#  前置：Vault 里 secret/llm-service/callers 有 LLM_TOKEN_LLM_REPORT，
#        且 llm-service 的 LLM_GUARD.report_callers 里列了 "llm-report"。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: content-agents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_LLM_REPORT
