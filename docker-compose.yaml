# ============================================================
#  docker-compose.yaml — 本地 / 测试环境
# ============================================================
#  启动:  docker compose up -d
#  查看:  docker compose logs -f
#  停止:  docker compose down
# ============================================================

services:
  panghu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: panghu-agent:latest
    container_name: panghu-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ---- 模型提供商 ----
      - PROVIDER=${PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ---- API 管理 ----
      - API_PORT=8000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-secret-change-me}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@localhost}
      # ---- 数据库 ----
      - DATABASE_URL=sqlite:////app/data/data.db
    volumes:
      # 数据持久化（SQLite + 报告）
      - ./data:/app/data
      # 收款二维码（可选 — 放 qrcodes/ 下的图片）
      - ./api/qrcodes:/app/api/qrcodes:ro
      # 生成的报告（可选挂载）
      - ./crewai/report.md:/app/crewai/report.md
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
