# ============================================================
#  Agent -> RAG 调用令牌（每个 Agent 命名空间一份）
#
#  从 Vault 的 secret/rag-service/callers 里只取本 Agent 的那一个键，
#  这样每个命名空间拿不到别的 Agent 的令牌。
#
#  deploy-api.sh 会用 __NAMESPACE__ / __VAULT_TOKEN_KEY__ 填充后应用。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-token
  namespace: __NAMESPACE__
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-token
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: __VAULT_TOKEN_KEY__
