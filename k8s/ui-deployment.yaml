# ============================================================
#  Research Agent — UI 服务 (K8s 部署, Gradio)
#  agent.py 通过 ConfigMap 注入（deploy-ui.sh 自动创建 ui-agent ConfigMap）
#  更新: bash scripts/deploy-ui.sh research_agent
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: arm-cluster-master:5000/agent-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 7860
        env:
        - name: API_BASE
          value: "http://api.__NAMESPACE__.svc.cluster.local"
        - name: GRADIO_SERVER_PORT
          value: "7860"
        volumeMounts:
        - name: source
          mountPath: /app/app/ui/agent.py
          subPath: agent.py
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 7860
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: source
        configMap:
          name: ui-agent
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: __NAMESPACE__
spec:
  selector:
    app: ui
  ports:
  - port: 7860
