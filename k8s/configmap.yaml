# ============================================================
#  Agent 通用配置
#  用法: sed "s/__NAMESPACE__/research-agent/g" k8s/configmap.yaml | kubectl apply -f -
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: __NAMESPACE__
data:
  PROVIDER: "custom"
  CUSTOM_API_BASE: "http://0.0.0.0"
  CUSTOM_MODEL: "deepseek-v4-pro"
  # PROVIDER: "deepseek"

