# ============================================================
#  调用方 -> llm-service 令牌（每个命名空间一份，**各自专属**）
#
#  从 Vault 的 secret/llm-service/callers 里只取本调用方的那一个键，
#  这样每个命名空间拿不到别人的令牌 —— 与 RAG 的 rag-token 同一套做法。
#
#  **变量名即身份**：llm-service 从 LLM_TOKEN_<CALLER> 反推调用者名
#  （LLM_TOKEN_GAME_REVIEW -> game-review），客户端无法自称。
#
#  deploy-api.sh 会用 __NAMESPACE__ / __VAULT_TOKEN_KEY__ 填充后应用。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: __NAMESPACE__
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: __VAULT_TOKEN_KEY__
