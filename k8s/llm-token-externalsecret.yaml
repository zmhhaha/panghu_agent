# ============================================================
#  Agent -> llm-service 调用令牌（每个 Agent 命名空间一份）
#
#  与 RAG 的 rag-token 同源（secret/llm-service/auth），不各存一份。
#  deploy-api.sh 会用 __NAMESPACE__ 填充后应用。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: __NAMESPACE__
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/llm-service/auth
