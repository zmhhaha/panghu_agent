apiVersion: v1
kind: Service
metadata:
  name: panghu-agent
  namespace: panghu-agent
  labels:
    app: panghu-agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: panghu-agent
---
