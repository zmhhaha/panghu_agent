# ============================================================
#  Agent 密钥（请替换为真实 API Key）
#  用法: sed "s/__NAMESPACE__/research-agent/g" k8s/secret.yaml | kubectl apply -f -
#  注意: 提交代码前务必清除真实 key，部署时手动替换
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: __NAMESPACE__
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-api-key-here"
  CUSTOM_API_KEY: "sk-your-api-key-here"
