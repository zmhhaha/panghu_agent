# ============================================================
#  Research Agent — API 服务 (K8s 部署)
#  源码通过 hostPath 挂载，改代码无需重建镜像，pod 自动热重载
#  用法: sed "s/__NAMESPACE__/research-agent/g" k8s/api-deployment.yaml | kubectl apply -f -
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-api
  template:
    metadata:
      labels:
        app: research-api
    spec:
      nodeName: arm-cluster-master
      containers:
      - name: api
        image: arm-cluster-master:5000/agent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agent-config
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secret
              key: OPENAI_API_KEY
              optional: true
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: code
        hostPath:
          path: /root/armbianbegin/panghu_agent
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  selector:
    app: research-api
  ports:
  - port: 80
    targetPort: 8000
