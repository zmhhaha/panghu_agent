# ============================================================
#  Research Agent — API 服务 (K8s 部署)
#  agent.py 通过 ConfigMap 挂载（api-agent），config 通过 ConfigMap 注入，secret 通过 Secret 注入
#  更新: bash scripts/deploy-api.sh research_agent
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-api
  template:
    metadata:
      labels:
        app: research-api
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/agent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agent-config
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secret
              key: OPENAI_API_KEY
              optional: true
        - name: CUSTOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secret
              key: CUSTOM_API_KEY
              optional: true
        # DeepSeek 凭据（独立前缀，与 panghu_game 约定一致）
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secret
              key: DEEPSEEK_API_KEY
              optional: true
        volumeMounts:
        - name: source
          mountPath: /app/app/api/agent.py
          subPath: agent.py
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8000
        #   initialDelaySeconds: 30
        #   periodSeconds: 30
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 8000
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
      volumes:
      - name: source
        configMap:
          name: api-agent
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  selector:
    app: research-api
  ports:
  - port: 80
    targetPort: 8000
