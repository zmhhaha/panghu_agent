# ============================================================
#  游戏试玩评价 agent — 专属 API 服务 (K8s 部署)
#  使用独立镜像 game-review-agent-api（含 Playwright/Chromium），不依赖共享 agent-api
#  agent.py 通过 ConfigMap 挂载（api-agent）
#  更新: bash game_review_agent/deploy-api.sh
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-review-api
  template:
    metadata:
      labels:
        app: game-review-api
        # llm-service 的 NetworkPolicy 只放行带此标签的 Pod（注 2026-09-20 实测：本集群 CNI 不实现 NetworkPolicy，该策略当前未生效；缺标签不会被拦、也不会表现为超时。见 docs/network-policy-engine.md）
        llm-client: "true"
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/game-review-agent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        # 模型凭据已全部收归 llm-service：不再注入 provider API Key，也不再从 agent-config 取值。
        # 游戏试玩 agent：受保护游戏的登录 cookie（可选，不配置则只能访问公开页面）
        - name: GAME_AUTH_COOKIE
          valueFrom:
            secretKeyRef:
              name: game-auth
              key: GAME_AUTH_COOKIE
              optional: true
        - name: GAME_AUTH_COOKIES_JSON
          valueFrom:
            secretKeyRef:
              name: game-auth
              key: GAME_AUTH_COOKIES_JSON
              optional: true
        # 模型调用：走集群内 llm-service，本服务不再持有 provider 凭据。
        # 用 deepseek-trusted（trusted 档）——guarded 档禁 tools/response_format，会直接 400。
        - name: LLM_BASE_URL
          value: http://llm-service.llm.svc.cluster.local/v1
        - name: LLM_MODEL
          value: deepseek-trusted
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-token
              key: LLM_SERVICE_TOKEN
              optional: true
        volumeMounts:
        - name: source
          mountPath: /app/app/api/agent.py
          subPath: agent.py
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 3Gi
        livenessProbe:
          httpGet:
            path: /game-review-health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /game-review-health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: source
        configMap:
          name: api-agent
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  selector:
    app: game-review-api
  ports:
  - port: 80
    targetPort: 8000
