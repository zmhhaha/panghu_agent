# ============================================================
#  游戏试玩评价 agent — 专属 API 服务 (K8s 部署)
#  使用独立镜像 game-review-agent-api（含 Playwright/Chromium），不依赖共享 agent-api
#  agent.py 通过 ConfigMap 挂载（api-agent）
#  更新: bash game_review_agent/deploy-api.sh
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-review-api
  template:
    metadata:
      labels:
        app: game-review-api
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/game-review-agent-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: agent-config
        env:
        # DeepSeek 凭据（与 panghu_game 约定一致，provider 用独立前缀）
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-secret
              key: DEEPSEEK_API_KEY
              optional: true
        # 游戏试玩 agent：受保护游戏的登录 cookie（可选，不配置则只能访问公开页面）
        - name: GAME_AUTH_COOKIE
          valueFrom:
            secretKeyRef:
              name: game-auth
              key: GAME_AUTH_COOKIE
              optional: true
        - name: GAME_AUTH_COOKIES_JSON
          valueFrom:
            secretKeyRef:
              name: game-auth
              key: GAME_AUTH_COOKIES_JSON
              optional: true
        volumeMounts:
        - name: source
          mountPath: /app/app/api/agent.py
          subPath: agent.py
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "2"
            memory: 3Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: source
        configMap:
          name: api-agent
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: __NAMESPACE__
spec:
  selector:
    app: game-review-api
  ports:
  - port: 80
    targetPort: 8000
