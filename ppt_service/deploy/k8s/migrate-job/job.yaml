apiVersion: batch/v1
kind: Job
metadata:
  name: ppt-migrate-schema4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ppt-migrator
    spec:
      restartPolicy: Never
      serviceAccountName: ppt-migrator
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: REQUIRED_PPT_SITE_ARM64_REGISTRY_MANIFEST:unresolved
          imagePullPolicy: IfNotPresent
          workingDir: /opt/ppt-service
          command: [/usr/local/bin/python, -m, ppt_service.server.migrate]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ppt-database-migrator
                  key: DATABASE_URL
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
