apiVersion: v1
kind: Namespace
metadata:
  name: literature-downloader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: literature-downloader
  namespace: literature-downloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: literature-downloader-scihub
  namespace: literature-downloader
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: literature-downloader-scihub
  namespace: literature-downloader
subjects:
  - kind: ServiceAccount
    name: literature-downloader
    namespace: literature-downloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: literature-downloader-scihub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: literature-data
  namespace: literature-downloader
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: literature-downloader
spec:
  replicas: 1
  # The API image is large on the cluster's ARM nodes; allow a slow first pull
  # without marking an otherwise healthy rollout as failed.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: literature-api
  template:
    metadata:
      labels:
        app: literature-api
        # llm-service 的 NetworkPolicy 只放行带此标签的 Pod
        llm-client: "true"
    spec:
      serviceAccountName: literature-downloader
      containers:
        - name: api
          image: __API_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: LITERATURE_DATA_DIR
              value: /data/literature
            - name: LITERATURE_SEARCH_ROUNDS
              value: "3"
            - name: LITERATURE_SEARCH_LIMIT
              value: "0"
            - name: LITERATURE_PER_PROVIDER
              value: "20"
            - name: LITERATURE_MAX_SEARCH_VARIANTS
              value: "6"
            - name: LITERATURE_DOWNLOAD_CONCURRENCY
              value: "6"
            - name: LITERATURE_DOWNLOAD_RETRIES
              value: "2"
            - name: LITERATURE_DOWNLOAD_RETRY_BACKOFF_MS
              value: "500"
            - name: LITERATURE_DOWNLOAD_REQUEST_INTERVAL_MS
              value: "250"
            - name: ACADEMIC_API_REQUEST_INTERVAL_MS
              value: "350"
            - name: ACADEMIC_API_RETRY_BACKOFF_SECONDS
              value: "2"
            - name: ACADEMIC_API_RATE_LIMIT_MAX_WAIT_SECONDS
              value: "60"
            - name: LITERATURE_DOWNLOAD_BACKEND
              value: hybrid
            - name: SCIHUB_JOB_NAMESPACE
              value: literature-downloader
            - name: SCIHUB_JOB_IMAGE
              value: arm-cluster-master:5000/scihub-cli:latest
            - name: SCIHUB_PVC_NAME
              value: scihub-papers-pvc
            - name: SCIHUB_PAPERS_DIR
              value: /data/scihub-papers
            - name: SCIHUB_JOB_TIMEOUT
              value: "3600"
            - name: SCIHUB_JOB_POLL_INTERVAL
              value: "5"
            - name: SCIHUB_RETRIES
              value: "2"
            # Contact identity for OpenAlex/Crossref polite API access.
            # This is not a secret and is intentionally kept out of Vault.
            - name: ACADEMIC_CONTACT_EMAIL
              value: panghuer001@163.com
            # 模型调用：走集群内 llm-service，本服务不再持有 provider 凭据。
            # 用 deepseek-trusted（trusted 档）——检索计划与重排需要 response_format，
            # deepseek-guarded 会直接 400；本服务不需要函数调用，但 trusted 本身就是它该用的档。
            - name: LLM_BASE_URL
              value: http://llm-service.llm.svc.cluster.local/v1
            - name: LLM_MODEL
              value: deepseek-trusted
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-token
                  key: LLM_SERVICE_TOKEN
                  optional: true
            # 模型凭据已全部收归 llm-service：不再注入 provider API Key（见上方 LLM_*）。
            # 本服务原先还从这里取 OPENALEX_API_KEY，但该键从未真正写入过 Vault，
            # 且 OpenAlex 匿名额度够用（健康检查里 openalex_api_key_configured 一直是 false），
            # 随 agent-secret 一并移除。将来要用带 key 的额度，再加回环境变量和 Vault 路径即可。
          volumeMounts:
            - name: data
              mountPath: /data/literature
            - name: scihub-papers
              mountPath: /data/scihub-papers
              readOnly: true
            - name: source
              mountPath: /app/app/api/agent.py
              subPath: agent.py
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: literature-data
        - name: scihub-papers
          persistentVolumeClaim:
            claimName: scihub-papers-pvc
        - name: source
          configMap:
            name: api-agent
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: literature-downloader
spec:
  selector:
    app: literature-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
