apiVersion: v1
kind: Namespace
metadata:
  name: literature-downloader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: literature-downloader
  namespace: literature-downloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: literature-downloader-scihub
  namespace: literature-downloader
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: literature-downloader-scihub
  namespace: literature-downloader
subjects:
  - kind: ServiceAccount
    name: literature-downloader
    namespace: literature-downloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: literature-downloader-scihub
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: literature-data
  namespace: literature-downloader
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: literature-downloader
spec:
  replicas: 1
  # The API image is large on the cluster's ARM nodes; allow a slow first pull
  # without marking an otherwise healthy rollout as failed.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: literature-api
  template:
    metadata:
      labels:
        app: literature-api
    spec:
      serviceAccountName: literature-downloader
      containers:
        - name: api
          image: __API_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: LITERATURE_DATA_DIR
              value: /data/literature
            - name: LITERATURE_SEARCH_ROUNDS
              value: "3"
            - name: LITERATURE_SEARCH_LIMIT
              value: "0"
            - name: LITERATURE_PER_PROVIDER
              value: "20"
            - name: LITERATURE_MAX_SEARCH_VARIANTS
              value: "6"
            - name: LITERATURE_DOWNLOAD_CONCURRENCY
              value: "6"
            - name: LITERATURE_DOWNLOAD_RETRIES
              value: "2"
            - name: LITERATURE_DOWNLOAD_RETRY_BACKOFF_MS
              value: "500"
            - name: LITERATURE_DOWNLOAD_REQUEST_INTERVAL_MS
              value: "250"
            - name: ACADEMIC_API_REQUEST_INTERVAL_MS
              value: "350"
            - name: ACADEMIC_API_RETRY_BACKOFF_SECONDS
              value: "2"
            - name: ACADEMIC_API_RATE_LIMIT_MAX_WAIT_SECONDS
              value: "60"
            - name: LITERATURE_DOWNLOAD_BACKEND
              value: hybrid
            - name: SCIHUB_JOB_NAMESPACE
              value: literature-downloader
            - name: SCIHUB_JOB_IMAGE
              value: arm-cluster-master:5000/scihub-cli:latest
            - name: SCIHUB_PVC_NAME
              value: scihub-papers-pvc
            - name: SCIHUB_PAPERS_DIR
              value: /data/scihub-papers
            - name: SCIHUB_JOB_TIMEOUT
              value: "3600"
            - name: SCIHUB_JOB_POLL_INTERVAL
              value: "5"
            - name: SCIHUB_RETRIES
              value: "2"
            # Contact identity for OpenAlex/Crossref polite API access.
            # This is not a secret and is intentionally kept out of Vault.
            - name: ACADEMIC_CONTACT_EMAIL
              value: panghuer001@163.com
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENALEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: OPENALEX_API_KEY
                  optional: true
            - name: CUSTOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: CUSTOM_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data/literature
            - name: scihub-papers
              mountPath: /data/scihub-papers
              readOnly: true
            - name: source
              mountPath: /app/app/api/agent.py
              subPath: agent.py
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: literature-data
        - name: scihub-papers
          persistentVolumeClaim:
            claimName: scihub-papers-pvc
        - name: source
          configMap:
            name: api-agent
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: literature-downloader
spec:
  selector:
    app: literature-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
