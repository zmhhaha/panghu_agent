apiVersion: v1
kind: Namespace
metadata:
  name: literature-downloader
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: literature-data
  namespace: literature-downloader
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: literature-downloader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: literature-api
  template:
    metadata:
      labels:
        app: literature-api
    spec:
      containers:
        - name: api
          image: __API_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: LITERATURE_DATA_DIR
              value: /data/literature
            - name: LITERATURE_MAX_ROUNDS
              value: "3"
            - name: LITERATURE_SEARCH_LIMIT
              value: "30"
            - name: LITERATURE_PER_PROVIDER
              value: "10"
            - name: ACADEMIC_CONTACT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: literature-config
                  key: ACADEMIC_CONTACT_EMAIL
                  optional: true
            - name: SEMANTIC_SCHOLAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: literature-config
                  key: SEMANTIC_SCHOLAR_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data/literature
            - name: source
              mountPath: /app/app/api/agent.py
              subPath: agent.py
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /literature-health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: literature-data
        - name: source
          configMap:
            name: api-agent
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: literature-downloader
spec:
  selector:
    app: literature-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
