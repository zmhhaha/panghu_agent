apiVersion: v1
kind: Namespace
metadata:
  name: panghu-agent
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: panghu-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_BINGBICHUNQIU
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-token
  namespace: panghu-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-token
    creationPolicy: Owner
  data:
    - secretKey: RAG_TOKEN
      remoteRef:
        key: secret/data/rag-service/callers
        property: RAG_TOKEN_BINGBICHUNQIU
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-api
  namespace: panghu-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-api
  template:
    metadata:
      labels:
        app: baijiazhengming-api
        llm-client: "true"
        rag-client: "true"
    spec:
      initContainers:
        - name: rag-sync-bingbichunqiu
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "/app/scripts/sync_knowledge.py"]
          env:
            - name: AGENT_NAME
              value: bingbichunqiu
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
            - name: RAG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-token
                  key: RAG_TOKEN
                  optional: true
      containers:
        - name: api
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn", "baijiazhengming.api:app"]
          args: ["--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: LLM_BASE_URL
              value: http://llm-service.llm.svc.cluster.local/v1
            - name: LLM_MODEL
              value: deepseek-guarded
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-token
                  key: LLM_SERVICE_TOKEN
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
            - name: RAG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rag-token
                  key: RAG_TOKEN
                  optional: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-api
  namespace: panghu-agent
spec:
  selector:
    app: baijiazhengming-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-ui
  namespace: panghu-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-ui
  template:
    metadata:
      labels:
        app: baijiazhengming-ui
    spec:
      containers:
        - name: ui
          image: arm-cluster-master:5000/baijiazhengming-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
          env:
            - name: API_BASE
              value: http://baijiazhengming-api.panghu-agent.svc.cluster.local
            - name: GRADIO_SERVER_PORT
              value: "7860"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-ui
  namespace: panghu-agent
spec:
  selector:
    app: baijiazhengming-ui
  ports:
    - port: 7860
      targetPort: 7860
