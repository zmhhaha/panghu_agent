apiVersion: v1
kind: Namespace
metadata:
  name: baijiazhengming
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: baijiazhengming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  # extract 整个 callers 路径：八个人格的 token 一次性全注入，env 名天然就是
  # LLM_TOKEN_<SLUG> —— 代码就是按这个名字找各自的凭据的（见 registry/credentials）。
  dataFrom:
    - extract:
        key: secret/data/llm-service/callers
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-token
  namespace: baijiazhengming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/rag-service/callers
---
# 框架 API 的最小鉴权 token（见 baijiazhengming/auth.py）。UI 与 API 各注入一次：
# 集群里任何 Pod 都能访问这个 ClusterIP Service，没有这道门时提交任务无需任何凭据，
# 而提交是要花 llm-service 额度的，user_id 又来自请求体。
#
# ⚠️ 首次部署前必须先写进 Vault。下面两处注入都是 `optional: true`，所以 Secret 缺失时
#    Pod 照样起得来，但 API 会**拒绝所有任务请求**（刻意的失败关闭）：/health 报 degraded
#    并写明原因，deploy.sh 的第 3 步自检会因此停住、不切流量。相比让 Pod 卡在
#    CreateContainerConfigError，这样运维看到的是一条能直接照做的错误信息。
#      kubectl exec -n vault vault-0 -- vault kv put secret/baijiazhengming/api \
#        BAIJIA_API_TOKEN="$(openssl rand -hex 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: baijia-api-token
  namespace: baijiazhengming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: baijia-api-token
    creationPolicy: Owner
  data:
    - secretKey: BAIJIA_API_TOKEN
      remoteRef:
        key: secret/data/baijiazhengming/api
        property: BAIJIA_API_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-api
  namespace: baijiazhengming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-api
  template:
    metadata:
      labels:
        app: baijiazhengming-api
        llm-client: "true"
        rag-client: "true"
    spec:
      initContainers:
        # 八个人格的基线 knowledge.md 各同步一次，各自用自己的 RAG 凭据
        # （见 baijiazhengming/sync_baseline.py）。失败只告警，不阻塞启动。
        - name: rag-sync
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "baijiazhengming.sync_baseline"]
          envFrom:
            - secretRef: {name: rag-token}
          env:
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
      containers:
        - name: api
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn", "baijiazhengming.api:app"]
          args: ["--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            # 八个人格的凭据都在这里：键名就是 LLM_TOKEN_<SLUG> / RAG_TOKEN_<SLUG>，
            # 代码按 slug 取对应的那一个。拿错 token 会读到别人的 RAG collection，
            # 所以这是正确性问题，不是记账问题。
            - secretRef: {name: llm-token}
            - secretRef: {name: rag-token}
            # 框架 API 自己的 token：只用于校验调用方，和上面按人格分的凭据是两件事
            - secretRef: {name: baijia-api-token, optional: true}
          env:
            - name: LLM_BASE_URL
              value: http://llm-service.llm.svc.cluster.local/v1
            - name: LLM_MODEL
              value: deepseek-guarded
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
            # 单次 LLM 调用超时（秒）。crew 里的默认值也是 120，这里显式写出来便于调整。
            - name: LLM_TIMEOUT
              value: "120"
            # 「运行中」任务的看门狗时限（秒）：超过它的任务会被标成 timeout，该用户随即可
            # 重新提交。注意看门狗只解锁用户、不中断执行（卡住的线程仍占着并发槽位）。
            - name: BAIJIA_RUNNING_TTL
              value: "900"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-api
  namespace: baijiazhengming
spec:
  selector:
    app: baijiazhengming-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-ui
  namespace: baijiazhengming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-ui
  template:
    metadata:
      labels:
        app: baijiazhengming-ui
    spec:
      containers:
        - name: ui
          image: arm-cluster-master:5000/baijiazhengming-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
          envFrom:
            # 和 API 用同一个 token：UI 是唯一需要调用框架 API 的常规消费者
            - secretRef: {name: baijia-api-token, optional: true}
          env:
            - name: API_BASE
              value: http://baijiazhengming-api.baijiazhengming.svc.cluster.local
            - name: GRADIO_SERVER_PORT
              value: "7860"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-ui
  namespace: baijiazhengming
spec:
  selector:
    app: baijiazhengming-ui
  ports:
    - port: 7860
      targetPort: 7860
