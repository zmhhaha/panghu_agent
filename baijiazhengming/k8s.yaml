apiVersion: v1
kind: Namespace
metadata:
  name: baijiazhengming
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: baijiazhengming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  # extract 整个 callers 路径：八个人格的 token 一次性全注入，env 名天然就是
  # LLM_TOKEN_<SLUG> —— 代码就是按这个名字找各自的凭据的（见 registry/credentials）。
  dataFrom:
    - extract:
        key: secret/data/llm-service/callers
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-token
  namespace: baijiazhengming
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rag-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/rag-service/callers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-api
  namespace: baijiazhengming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-api
  template:
    metadata:
      labels:
        app: baijiazhengming-api
        llm-client: "true"
        rag-client: "true"
    spec:
      initContainers:
        # 八个人格的基线 knowledge.md 各同步一次，各自用自己的 RAG 凭据
        # （见 baijiazhengming/sync_baseline.py）。失败只告警，不阻塞启动。
        - name: rag-sync
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "baijiazhengming.sync_baseline"]
          envFrom:
            - secretRef: {name: rag-token}
          env:
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
      containers:
        - name: api
          image: arm-cluster-master:5000/agent-api:latest
          imagePullPolicy: Always
          command: ["python", "-m", "uvicorn", "baijiazhengming.api:app"]
          args: ["--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            # 八个人格的凭据都在这里：键名就是 LLM_TOKEN_<SLUG> / RAG_TOKEN_<SLUG>，
            # 代码按 slug 取对应的那一个。拿错 token 会读到别人的 RAG collection，
            # 所以这是正确性问题，不是记账问题。
            - secretRef: {name: llm-token}
            - secretRef: {name: rag-token}
          env:
            - name: LLM_BASE_URL
              value: http://llm-service.llm.svc.cluster.local/v1
            - name: LLM_MODEL
              value: deepseek-guarded
            - name: RAG_URL
              value: http://rag-service.data.svc.cluster.local:8080
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-api
  namespace: baijiazhengming
spec:
  selector:
    app: baijiazhengming-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baijiazhengming-ui
  namespace: baijiazhengming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: baijiazhengming-ui
  template:
    metadata:
      labels:
        app: baijiazhengming-ui
    spec:
      containers:
        - name: ui
          image: arm-cluster-master:5000/baijiazhengming-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
          env:
            - name: API_BASE
              value: http://baijiazhengming-api.baijiazhengming.svc.cluster.local
            - name: GRADIO_SERVER_PORT
              value: "7860"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 7860}
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: baijiazhengming-ui
  namespace: baijiazhengming
spec:
  selector:
    app: baijiazhengming-ui
  ports:
    - port: 7860
      targetPort: 7860
